<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Upcoming Hearings</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="navbar">
      <h2>Court Case Reminder System</h2>

      <div class="menu">
        <a href="dashboard.html">Dashboard</a>
        <a href="add-case.html">Add Case</a>
        <a href="upcoming.html">Upcoming Hearings</a>
        <a href="index.html">Logout</a>
      </div>
    </div>

    <a href="dashboard.html" class="card-link">
    <div class="stats">
      <div class="card">
        <h3 id="totalCases">0</h3>
        <p>Total Cases</p>
      </div>
    </a>

      <a href="upcoming.html" class="card-link">
      <div class="card upcoming-card">
        <h3 id="upcomingCount">0</h3>
        <p>Upcoming Hearings</p>
      </div>
    </div>
    </a>

    <div class="container">
      <h3>Upcoming Hearings (Within 7 Days)</h3>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <input type="text" id="searchCase" placeholder="Search Upcoming..." onkeyup="searchCase()" 
                style="padding:8px; width:250px; border: 1px solid #ccc; border-radius: 4px;">

          <button onclick="downloadExcel()" style="background-color: #28a745; color: white; padding: 10px 15px; border: none; cursor: pointer; font-weight: bold; border-radius: 4px;">
              📊 Download Sheet
          </button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Case Number</th>
            <th>Department</th>
            <th>Hearing Date</th>
            <th>Case File</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="upcomingTable"></tbody>
      </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="js/app.js"></script>

    <footer>
      <p>District Court Monitoring System, Amroha | Developed By NIC | 2026</p>
    </footer>
  </body>
</html>
