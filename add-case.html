<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <title>Add Case</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="navbar">
      <h2>Court Case Reminder System</h2>

      <div class="menu">
        <a href="dashboard.html">Dashboard</a>
        <a href="add-case.html">Add Case</a>
        <a href="upcoming.html">Upcoming Hearings</a>
        <a href="index.html">Logout</a>
      </div>
    </div>

    <div class="container">
      <h3>Add New Case</h3>

      <!-- <label>Case Number</label> -->
      <label>Case Number <span style="color: red;">*</span></label>
      <!-- <input type="text" id="caseNumber" required/> -->
      <input 
          type="text" 
          id="caseNumber" 
          oninput="this.value = this.value.replace(/[^0-9/]/g, '');" 
          placeholder="e.g. 123/2024" 
          required 
      />

      <label>Department</label>
      <!-- <select id="department">
        <option>Revenue</option>
        <option>Police</option>
        <option>Education</option>
        <option>Health</option>
        <option>Public Works</option>
      </select> -->
      <select id="department">
        <option value="">-- Select Department --</option>
        <option>Agriculture (कृषि विभाग)</option>
        <option>Co-operative (सहकारिता)</option>
        <option>Dairy Development (दुग्ध विकास)</option>
        <option>Divyangjan Empowerment (दिव्यांगजन सशक्तिकरण विभाग)</option>
        <option>Education - Higher (उच्च शिक्षा)</option>
        <option>Education - Technical (प्राविधिक शिक्षा)</option>
        <option>Energy (ऊर्जा)</option>
        <option>Excise (आबकारी)</option>
        <option>Finance (वित्त)</option>
        <option>Fisheries (मत्स्य उत्पादन)</option>
        <option>Food and Logistics (खाद्द एवं रसद विभाग)</option>
        <option>Food Safety and Drug Administration (खाद्द सुरक्षा एवं औषधि प्रशासन विभाग)</option>
        <option>Forest (वन विभाग)</option>
        <option>Home and Confidential / Jail (ग्रह एंव गोपन/कारागार प्रशासन एवं सुधार)</option>
        <option>Homeopathy (होमियोपैथी सेवाये उ. प्र.)</option>
        <option>Horticulture and Food Processing (उधान एवं खाद्य प्रसंस्करण)</option>
        <option>Irrigation and Water Resources (सिचाई एवं जल संसाधन विभाग)</option>
        <option>Jal Nigam (जल निगम)</option>
        <option>Khadi and Village Industries (खादी एवं ग्रामोधोग)</option>
        <option>Labour (श्रम विभाग)</option>
        <option>Livestock (पशुधन)</option>
        <option>Local Fund Audit (स्थानीय निधि लेखा परीक्षा विभाग)</option>
        <option>Medical Health and Family Welfare (चिकित्सा स्वास्थ्य एवं परिवार कल्याण)</option>
        <option>Minor Irrigation (लघु सिचाई एवं भूगर्भ जल)</option>
        <option>Panchayati Raj (पंचायती राज)</option>
        <option>Planning (नियोजन एवं राज्य योजना आयोग)</option>
        <option>Public Works (लोक निर्माण)</option>
        <option>Revenue (राजस्व)</option>
        <option>Rural Development (ग्राम्य विकास)</option>
        <option>Rural Engineering (ग्रामीण अभियंत्रण विभाग)</option>
        <option>Social Welfare (समाज कल्याण)</option>
        <option>Sports (खेलकूद)</option>
        <option>Stamp and Registration (स्टाम एवं रजिस्ट्रेशन)</option>
        <option>State Tax (राज्य कर विभाग)</option>
        <option>Sugar Industry and Cane Development (चीनी उधोग एवं गन्ना विकास)</option>
        <option>Transport (परिवहन)</option>
        <option>Urban Development (नगर विकास तथा नगरीय रोजगार एवं गरीबी)</option>
        <option>Women and Child Development (महिला एवं बाल विकास)</option>
        <option>Youth Welfare (युवा कल्याण)</option>
      </select>

      <!-- <label>Next Hearing Date</label> -->
      <label>Next Hearing Date <span style="color: red;">*</span></label>
      <!-- <input type="date" id="hearingDate" /> -->
      <!-- <input type="text" id="hearingDate" placeholder="Select Date.." /> -->
      <input type="text" id="hearingDate" placeholder="Select Date.." required />

      <label>Case Copy (pdf/jpeg/jpg)</label>
      <input type="file" id="caseFile" />

      <br /><br />

      <button onclick="addCase()">Submit Case</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="js/app.js"></script>
    <footer>
      <p>District Court Monitoring System, Amroha | Developed By NIC | 2026</p>
    </footer>
    <script>
    flatpickr("#hearingDate", {
      dateFormat: "d/m/Y", // This forces the dd/mm/yyyy format
      allowInput: true     // Allows users to type it in manually if they want
    });
    </script>
  </body>
</html>
